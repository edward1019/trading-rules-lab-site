<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Trading Rules Lab</title>
<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; background:#fff; color:#0f172a; }
  .wrap { max-width:980px; margin:0 auto; padding:28px 24px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:#64748b; font-size:13px; margin-bottom:20px; }
  .perf { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px; }
  @media (max-width:720px){ .perf{grid-template-columns:1fr} }
  .card { border:1px solid #e5e7eb; border-radius:10px; padding:14px 16px; background:#fafafa; }
  .card h3 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:#64748b; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat .k { font-size:11px; color:#94a3b8; }
  .stat .v { font-size:18px; font-weight:700; margin-top:2px; }
  .pos { color:#16a34a; } .neg { color:#ef4444; }
  .cal-wrap { padding:4px 0 8px; }
  .gh-sq { transition:transform .1s, box-shadow .1s; }
  .gh-sq:hover { transform:scale(1.5); box-shadow:0 2px 6px rgba(0,0,0,.2); z-index:10; }
  #day-detail { display:none; margin-top:20px; padding-top:16px; border-top:2px solid #e5e7eb; }
  .trig { border:1px solid #e5e7eb; border-radius:8px; padding:10px 12px; margin-bottom:8px; background:#fff; cursor:pointer; }
  .trig:hover { border-color:#93c5fd; }
  .trig.open { border-color:#2563eb; background:#f8fbff; }
  .badge { font-size:11px; padding:2px 10px; border-radius:12px; color:#fff; }
  .muted { color:#64748b; font-size:12px; }
  .rule-pane { margin-top:12px; padding:12px 14px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; display:none; }
  a.charts { display:inline-block; margin-top:10px; font-size:13px; color:#2563eb; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Trading Rules Lab</h1>
  <p class="sub" id="sub">Loading…</p>

  <div class="perf" id="perf"></div>

  <div class="cal-wrap">
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:14px" id="legend"></div>
    <div id="calendar"></div>
    <div id="day-detail"></div>
  </div>
</div>

<script>
const STATUS_COLOR = {
  full: "#22c55e",
  partial: "#f59e0b",
  missed: "#ef4444",
  weekend: "#e2e8f0",
  today: "#bfdbfe",
  pre_start: "#f1f5f9",
  future: "#f1f5f9",
};
const STATUS_LABEL = {
  full: "Full run — trigger(s) fired",
  partial: "Partial run — scan day, no new trigger",
  missed: "Missed — trading day gap",
  weekend: "Weekend / holiday",
  pre_start: "Before window",
  future: "Future",
};

let DATA = null;

function fmt$(v) {
  if (v == null) return "—";
  const s = Math.abs(v).toLocaleString("en-US", { maximumFractionDigits: 0 });
  return (v >= 0 ? "+$" : "-$") + s;
}
function cls(v) { return v >= 0 ? "pos" : "neg"; }

function monthAbbr(m) {
  return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1];
}

function buildPerf() {
  const o = DATA.performance.overall;
  const stake = DATA.performance.stake_per_trigger;
  let rulesHtml = "";
  for (const [rid, r] of Object.entries(DATA.performance.by_rule)) {
    const meta = DATA.rules[rid] || {};
    rulesHtml += `
      <div class="card">
        <h3>Rule · ${meta.title || rid}</h3>
        <p class="muted" style="margin:0 0 10px">${meta.blurb || r.blurb || ""}</p>
        <div class="stats">
          <div class="stat"><div class="k">Realized</div><div class="v ${cls(r.realized_pnl)}">${fmt$(r.realized_pnl)}</div></div>
          <div class="stat"><div class="k">Unrealized</div><div class="v ${cls(r.unrealized_pnl)}">${fmt$(r.unrealized_pnl)}</div></div>
          <div class="stat"><div class="k">Total · ${r.n_triggers} × $${stake}</div><div class="v ${cls(r.total_pnl)}">${fmt$(r.total_pnl)}</div></div>
        </div>
      </div>`;
  }
  document.getElementById("perf").innerHTML = `
    <div class="card">
      <h3>Overall paper P&amp;L</h3>
      <p class="muted" style="margin:0 0 10px">Each trigger = $${stake.toLocaleString()} notional · independent paper tickets</p>
      <div class="stats">
        <div class="stat"><div class="k">Realized</div><div class="v ${cls(o.realized_pnl)}">${fmt$(o.realized_pnl)}</div></div>
        <div class="stat"><div class="k">Unrealized</div><div class="v ${cls(o.unrealized_pnl)}">${fmt$(o.unrealized_pnl)}</div></div>
        <div class="stat"><div class="k">Total · ${o.n_triggers} triggers</div><div class="v ${cls(o.total_pnl)}">${fmt$(o.total_pnl)}</div></div>
      </div>
      <div class="muted" style="margin-top:8px">Closed ${o.n_realized} · Open ${o.n_unrealized} · Wins ${o.win_n} / Losses ${o.loss_n}</div>
    </div>
    ${rulesHtml}`;
}

function buildLegend() {
  const items = [
    ["full", "Full run"],
    ["partial", "Partial run"],
    ["missed", "Missed"],
    ["weekend", "Weekend"],
  ];
  document.getElementById("legend").innerHTML =
    items.map(([k, label]) =>
      `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#64748b;margin-right:12px">
        <span style="width:10px;height:10px;border-radius:2px;background:${STATUS_COLOR[k]};display:inline-block"></span>${label}</span>`
    ).join("") +
    `<span style="font-size:11px;color:#94a3b8;margin-left:4px">· Click any square to inspect</span>`;
}

function buildCalendar() {
  const days = DATA.days;
  const keys = Object.keys(days).sort();
  if (!keys.length) return;
  const start = new Date(keys[0] + "T12:00:00");
  const end = new Date(keys[keys.length - 1] + "T12:00:00");
  const months = [];
  let y = start.getFullYear(), m = start.getMonth() + 1;
  const ey = end.getFullYear(), em = end.getMonth() + 1;
  while (y < ey || (y === ey && m <= em)) {
    months.push([y, m]);
    m++; if (m > 12) { m = 1; y++; }
  }

  let colHeader = '<div style="display:flex;margin-left:36px;gap:2px;margin-bottom:4px">';
  for (let d = 1; d <= 31; d++) {
    colHeader += `<div style="width:14px;text-align:center;font-size:8px;color:#94a3b8;flex-shrink:0">${d}</div>`;
  }
  colHeader += "</div>";

  let rows = "";
  for (const [yr, mo] of months) {
    const dim = new Date(yr, mo, 0).getDate();
    let cells = "";
    for (let day = 1; day <= 31; day++) {
      if (day > dim) {
        cells += '<div style="width:14px;height:14px;flex-shrink:0"></div>';
        continue;
      }
      const ds = `${yr}-${String(mo).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const dd = days[ds];
      if (!dd) {
        cells += `<div style="width:14px;height:14px;border-radius:2px;background:#f1f5f9;flex-shrink:0" title="${ds}"></div>`;
        continue;
      }
      const bg = STATUS_COLOR[dd.status] || "#f1f5f9";
      const tip = `${dd.full_date} (${dd.weekday}) — ${STATUS_LABEL[dd.status] || dd.status}` +
        (dd.n_triggers ? ` · ${dd.n_triggers} trigger(s)` : "");
      const dot = dd.n_triggers
        ? '<span style="position:absolute;top:1px;right:1px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.9)"></span>'
        : "";
      const clickable = !["weekend", "future", "pre_start"].includes(dd.status);
      if (clickable) {
        cells += `<div id="sq-${ds}" class="gh-sq" style="width:14px;height:14px;border-radius:2px;background:${bg};cursor:pointer;position:relative;flex-shrink:0" onclick="showDay('${ds}')" title="${tip}">${dot}</div>`;
      } else {
        cells += `<div style="width:14px;height:14px;border-radius:2px;background:${bg};position:relative;flex-shrink:0" title="${tip}">${dot}</div>`;
      }
    }
    rows += `<div style="display:flex;align-items:center;gap:0;margin-bottom:3px">
      <div style="width:34px;font-size:10px;font-weight:600;color:#64748b;flex-shrink:0;text-align:right;padding-right:4px">${monthAbbr(mo)}</div>
      <div style="display:flex;gap:2px">${cells}</div></div>`;
  }
  document.getElementById("calendar").innerHTML = colHeader + rows;
}

function showDay(ds) {
  const d = DATA.days[ds];
  if (!d) return;
  document.querySelectorAll(".gh-sq").forEach(el => el.style.outline = "");
  const sq = document.getElementById("sq-" + ds);
  if (sq) sq.style.outline = "2px solid #2563eb";

  const BADGE = {
    full: ["#16a34a", "Full Run"],
    partial: ["#d97706", "Partial Run"],
    missed: ["#dc2626", "Missed"],
  };
  const [bc, bl] = BADGE[d.status] || ["#64748b", d.status];
  const badge = `<span class="badge" style="background:${bc}">${bl}</span>`;

  let trigHtml = "";
  if (d.trigger_ids.length) {
    trigHtml = `<div style="margin-top:14px">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin-bottom:8px">
        Triggers that day · $${DATA.performance.stake_per_trigger} each</div>`;
    for (const id of d.trigger_ids) {
      const t = DATA.triggers[id];
      if (!t) continue;
      const rule = DATA.rules[t.rule] || {};
      trigHtml += `
        <div class="trig" id="trig-${id}" onclick="showTrigger('${id.replace(/'/g,"\\'")}')">
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">
            <span style="font-weight:700">${t.ticker}</span>
            <span class="muted">${t.kind} · ${t.rule}</span>
            <span class="muted">entry $${t.entry} → ${t.status === "realized" ? ("exit $" + t.mark) : ("mark $" + t.mark)}</span>
            <span class="${cls(t.pnl)}" style="font-weight:700;font-size:13px">${fmt$(t.pnl)}</span>
            <span class="muted">${t.status}${t.reason ? " · " + t.reason : ""}</span>
          </div>
          <div class="rule-pane" id="pane-${id}">
            <div style="font-weight:700;margin-bottom:4px">${rule.title || t.rule}</div>
            <div class="muted" style="margin-bottom:8px">${rule.blurb || ""}</div>
            <div class="muted">Paper: $${t.stake} → ${t.shares} sh @ $${t.entry}
              · ROI ${(t.roi*100).toFixed(1)}% · R ${t.R ?? "—"}</div>
            ${t.why && t.why.pivot ? `<div class="muted" style="margin-top:6px">Why: ${t.kind} breakout · pivot $${t.why.pivot} · stop $${t.why.stop} · base ${t.why.base_days}d / ${(t.why.base_range*100).toFixed(1)}%</div>` : ""}
          </div>
        </div>`;
    }
    trigHtml += "</div>";
  } else {
    trigHtml = `<p class="muted" style="margin-top:14px">No new triggers this day. Overall / rule P&amp;L still accrue on open tickets.</p>`;
  }

  const el = document.getElementById("day-detail");
  el.style.display = "block";
  el.innerHTML = `
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px">
      <div style="font-size:18px;font-weight:700">${d.full_date}</div>
      <div class="muted">${d.weekday}</div>
      ${badge}
    </div>
    <div class="muted">${STATUS_LABEL[d.status] || ""}</div>
    ${d.n_triggers ? `<div style="margin-top:10px;display:flex;gap:16px">
      <div><span class="muted">Day realized</span> <b class="${cls(d.day_realized_pnl)}">${fmt$(d.day_realized_pnl)}</b></div>
      <div><span class="muted">Day unrealized</span> <b class="${cls(d.day_unrealized_pnl)}">${fmt$(d.day_unrealized_pnl)}</b></div>
      <div><span class="muted">Day total</span> <b class="${cls(d.day_total_pnl)}">${fmt$(d.day_total_pnl)}</b></div>
    </div>` : ""}
    ${trigHtml}
    <a class="charts" href="${DATA.charts_url}" target="_blank" rel="noopener">Open full K-line trade charts →</a>`;
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function showTrigger(id) {
  document.querySelectorAll(".trig").forEach(el => el.classList.remove("open"));
  document.querySelectorAll(".rule-pane").forEach(el => el.style.display = "none");
  const card = document.getElementById("trig-" + id);
  const pane = document.getElementById("pane-" + id);
  if (card) card.classList.add("open");
  if (pane) pane.style.display = "block";
}

fetch("portal_data.json")
  .then(r => r.json())
  .then(data => {
    DATA = data;
    document.getElementById("sub").textContent =
      `Paper book · $${data.performance.stake_per_trigger}/trigger · window ${data.window.start} → ${data.window.end} · generated ${data.generated}`;
    buildPerf();
    buildLegend();
    buildCalendar();
  })
  .catch(err => {
    document.getElementById("sub").textContent = "Failed to load portal_data.json: " + err;
  });
</script>
</body>
</html>
