<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Trading Rules Lab</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; background:#fff; color:#0f172a; }
  .wrap { max-width:980px; margin:0 auto; padding:28px 24px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:#64748b; font-size:13px; margin-bottom:20px; }
  .perf { display:flex; flex-direction:column; gap:14px; margin-bottom:22px; }
  .card { border:1px solid #e5e7eb; border-radius:10px; padding:16px 18px; background:#fafafa; width:100%; }
  .card h3 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:#64748b; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat .k { font-size:11px; color:#94a3b8; }
  .stat .v { font-size:22px; font-weight:700; margin-top:2px; }
  .rule-row { border:1px solid #e5e7eb; border-radius:8px; padding:12px 14px; margin-top:10px; background:#fff; cursor:pointer; }
  .rule-row:first-of-type { margin-top:4px; }
  .rule-row:hover { border-color:#86efac; }
  .rule-row.open { border-color:#16a34a; background:#f0fdf4; }
  .rule-row h4 { margin:0 0 6px; font-size:14px; }
  .rule-logic { display:none; margin-top:12px; padding-top:12px; border-top:1px solid #dcfce7; }
  .rule-row.open .rule-logic { display:block; }
  .logic-block { margin-bottom:10px; }
  .logic-block .lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#15803d; margin-bottom:3px; }
  .logic-block .txt { font-size:13px; color:#334155; line-height:1.55; }
  .card.clickable { cursor:pointer; }
  .card.clickable:hover { border-color:#93c5fd; }
  .card.open { border-color:#2563eb; background:#f8fbff; }
  .period-panel { display:none; margin-top:14px; padding-top:12px; border-top:1px solid #e2e8f0; }
  .card.open .period-panel, .rule-row.open .period-panel { display:block; }
  .period-table { width:100%; border-collapse:collapse; font-size:13px; }
  .period-table th, .period-table td { text-align:left; padding:6px 8px; border-bottom:1px solid #eef2f7; }
  .period-table th { color:#64748b; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  .pos { color:#16a34a; } .neg { color:#ef4444; }
  .sq { transition:transform .1s, box-shadow .1s; }
  .sq:hover { transform:scale(1.45); box-shadow:0 2px 6px rgba(0,0,0,.2); z-index:10; }
  #day-detail { display:none; margin-top:20px; padding-top:16px; border-top:2px solid #e5e7eb; }
  .trig { border:1px solid #e5e7eb; border-radius:8px; padding:12px 14px; margin-bottom:8px; background:#fff; cursor:pointer; }
  .trig:hover { border-color:#86efac; }
  .trig.active { border-color:#16a34a; background:#f0fdf4; }
  .muted { color:#64748b; font-size:12px; }
  #chart-panel { display:none; margin-top:16px; }
  #chart-caption { font-size:13px; color:#475569; margin-bottom:8px; }
  #chart { height:460px; border-radius:10px; overflow:hidden; background:#1a2332; }
  .toggles { display:flex; flex-wrap:wrap; gap:12px; margin:10px 0; font-size:12px; color:#475569; }
  .pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:#e2e8f0; color:#334155; margin-right:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Trading Rules Lab</h1>
  <p class="sub" id="sub">Loading…</p>
  <div class="perf" id="perf"></div>

  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:14px" id="legend"></div>
  <div id="calendar"></div>
  <div id="day-detail"></div>
  <div id="chart-panel">
    <div id="chart-caption"></div>
    <div class="toggles">
      <label><input type="checkbox" data-ma="sma50" checked> SMA50</label>
      <label><input type="checkbox" data-ma="sma150" checked> SMA150</label>
      <label><input type="checkbox" data-ma="sma200" checked> SMA200</label>
      <label><input type="checkbox" data-ma="ema21"> EMA21</label>
      <label><input type="checkbox" data-ma="ema9" checked> EMA9 (trail)</label>
    </div>
    <div id="chart"></div>
  </div>
</div>

<script>
const COLOR = { trigger: "#22c55e", idle: "#e2e8f0" };
const MA_STYLE = {
  sma50:  { name: "SMA50",  color: "#f5a623", width: 1.2 },
  sma150: { name: "SMA150", color: "#a78bfa", width: 1.2 },
  sma200: { name: "SMA200", color: "#60a5fa", width: 1.2 },
  ema21:  { name: "EMA21",  color: "#94a3b8", width: 1.0 },
  ema9:   { name: "EMA9",   color: "#f472b6", width: 1.4 },
};

let DATA = null;
let activeTrig = null;

function fmtPct(v) {
  if (v == null || Number.isNaN(v)) return "—";
  return (v >= 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
}
function cls(v) { return v >= 0 ? "pos" : "neg"; }
function stakeRoi(pnl, stake) {
  const s = stake || (DATA && DATA.performance && DATA.performance.stake_per_trigger) || 1000;
  return s ? pnl / s : 0;
}
function blockRoi(block) {
  const cap = block.capital_deployed || ((block.n_triggers || 0) * ((DATA && DATA.performance && DATA.performance.stake_per_trigger) || 1000)) || 1;
  return {
    realized: block.realized_roi ?? (block.realized_pnl || 0) / cap,
    unrealized: block.unrealized_roi ?? (block.unrealized_pnl || 0) / cap,
    total: block.total_roi ?? (block.total_pnl || 0) / cap,
  };
}
/** Rule's share of overall P&L bucket (0–1+). null if overall bucket ~0. */
function shareOfOverall(part, whole) {
  if (whole == null || Math.abs(whole) < 1e-9) return null;
  return part / whole;
}
function monthAbbr(m) {
  return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1];
}

function nl(s) {
  if (!s) return "—";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g, "<br>");
}
function glossaryHtml(glossary) {
  if (!glossary || !glossary.length) return "";
  const items = glossary.map(g =>
    `<div style="margin:4px 0"><b>${nl(g.term)}</b> — ${nl(g.def)}</div>`
  ).join("");
  return `<div class="logic-block" style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px 12px">
    <div class="lbl">术语（只解释一次）</div>
    <div class="txt">${items}</div>
  </div>`;
}
function periodTableHtml(periods) {
  if (!periods) return '<p class="muted">No period stats yet</p>';
  const labels = (DATA.performance.periods || ["12m", "6m", "3m", "1m"]);
  let rows = "";
  for (const lab of labels) {
    const p = periods[lab];
    if (!p) continue;
    rows += `<tr>
      <td><b>${lab}</b><div class="muted">${p.start} → ${p.end}</div></td>
      <td class="${cls(p.total_roi)}">${fmtPct(p.total_roi)}</td>
      <td class="${cls(p.realized_roi)}">${fmtPct(p.realized_roi)}</td>
      <td class="${cls(p.unrealized_roi)}">${fmtPct(p.unrealized_roi)}</td>
      <td class="${p.spy==null?'':cls(p.spy)}">${p.spy==null?'—':fmtPct(p.spy)}</td>
      <td class="${p.alpha==null?'':cls(p.alpha)}">${p.alpha==null?'—':fmtPct(p.alpha)}</td>
      <td class="muted">${p.n_triggers}</td>
    </tr>`;
  }
  return `<table class="period-table">
    <thead><tr>
      <th>Window</th><th>Total (to today)</th><th>Realized</th><th>Unrealized</th><th>SPY buy→today</th><th>Alpha</th><th>Triggers</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <p class="muted" style="margin-top:8px">Apple-to-apple: each ticket starts $1k. <b>SPY</b> = that $1k in SPY from buy → today. <b>Total</b> = stock while held, then sale proceeds stay in SPY until today. New $1k entries each get their own SPY leg from that buy date. Alpha = Total − SPY. Realized/Unrealized stay stock-only marks.</p>`;
}

function buildPerf() {
  const o = DATA.performance.overall;
  const or = blockRoi(o);
  let rulesHtml = "";
  for (const [rid, r] of Object.entries(DATA.performance.by_rule)) {
    const meta = (DATA.rules && DATA.rules[rid]) || {};
    const logic = r.logic || meta.logic || {};
    const rr = blockRoi(r);
    const sTotal = shareOfOverall(r.total_pnl, o.total_pnl);
    const sReal = shareOfOverall(r.realized_pnl, o.realized_pnl);
    const sUnreal = shareOfOverall(r.unrealized_pnl, o.unrealized_pnl);
    const share = (s) => s == null ? "" : ` <span class="muted" style="font-size:12px;font-weight:500">(${fmtPct(s)} of overall)</span>`;
    rulesHtml += `
      <div class="rule-row" id="rule-${rid}" onclick="toggleRule('${rid}')">
        <h4>${r.title || rid} <span class="muted" style="font-weight:500">· click for logic + windows</span></h4>
        <div class="stats">
          <div class="stat"><div class="k">Total gain/loss</div><div class="v ${cls(rr.total)}">${fmtPct(rr.total)}${share(sTotal)}</div></div>
          <div class="stat"><div class="k">Realized gain/loss</div><div class="v ${cls(rr.realized)}">${fmtPct(rr.realized)}${share(sReal)}</div></div>
          <div class="stat"><div class="k">Unrealized gain/loss</div><div class="v ${cls(rr.unrealized)}">${fmtPct(rr.unrealized)}${share(sUnreal)}</div></div>
        </div>
        <div class="muted" style="margin-top:6px">Rolling 12m · ${r.n_triggers} triggers · Closed ${r.n_realized} · Open ${r.n_unrealized}
          ${r.spy_matched!=null ? ` · matched SPY <b class="${cls(r.spy_matched)}">${fmtPct(r.spy_matched)}</b>` : ""}
          ${r.alpha!=null ? ` · alpha <b class="${cls(r.alpha)}">${fmtPct(r.alpha)}</b>` : ""}</div>
        <div class="rule-logic">
          ${glossaryHtml(logic.glossary)}
          <div class="logic-block"><div class="lbl">股票池 / Universe</div><div class="txt">${nl(logic.universe)}</div></div>
          <div class="logic-block"><div class="lbl">选股 / Select</div><div class="txt">${nl(logic.select)}</div></div>
          <div class="logic-block"><div class="lbl">买入 / Buy</div><div class="txt">${nl(logic.buy)}</div></div>
          <div class="logic-block"><div class="lbl">止损 / Stop</div><div class="txt">${nl(logic.stop)}</div></div>
          <div class="logic-block"><div class="lbl">止盈 / Take profit</div><div class="txt">${nl(logic.take_profit)}</div></div>
          <div class="period-panel" style="display:block;border-top:1px solid #dcfce7;margin-top:12px;padding-top:12px">
            <div class="muted" style="margin-bottom:6px">Rolling windows · vs SPY</div>
            ${periodTableHtml(r.periods)}
          </div>
        </div>
      </div>`;
  }
  const win = DATA.window || {};
  document.getElementById("perf").innerHTML = `
    <div class="card clickable" id="overall-card" onclick="toggleOverall()">
      <h3>Overall paper P&amp;L <span class="muted" style="font-weight:500;text-transform:none;letter-spacing:0">· click for 12m/6m/3m/1m</span></h3>
      <p class="muted" style="margin:0 0 10px">Rolling 12m (${win.start || "?"} → ${win.end || "?"}) · $1k/ticket · Total grows sale proceeds in SPY to today · SPY bench = $1k buy→today</p>
      <div class="stats">
        <div class="stat"><div class="k">Total gain/loss</div><div class="v ${cls(or.total)}">${fmtPct(or.total)}</div></div>
        <div class="stat"><div class="k">Realized gain/loss</div><div class="v ${cls(or.realized)}">${fmtPct(or.realized)}</div></div>
        <div class="stat"><div class="k">Unrealized gain/loss</div><div class="v ${cls(or.unrealized)}">${fmtPct(or.unrealized)}</div></div>
      </div>
      <div class="muted" style="margin-top:8px">Closed ${o.n_realized} · Still open ${o.n_unrealized} · Wins ${o.win_n} / Losses ${o.loss_n}
        ${o.spy_matched!=null ? ` · matched SPY <b class="${cls(o.spy_matched)}">${fmtPct(o.spy_matched)}</b>` : ""}
        ${o.alpha!=null ? ` · alpha <b class="${cls(o.alpha)}">${fmtPct(o.alpha)}</b>` : ""}</div>
      <div class="period-panel">
        ${periodTableHtml(o.periods)}
      </div>
    </div>
    <div class="card">
      <h3>Rules</h3>
      <p class="muted" style="margin:0 0 4px">Same 3 metrics as Overall (rule return %) · parentheses = this rule’s $ as % of overall $ · click for logic + windows</p>
      ${rulesHtml || '<p class="muted">No rules yet</p>'}
    </div>`;
}

function toggleOverall() {
  const el = document.getElementById("overall-card");
  if (!el) return;
  el.classList.toggle("open");
}

function toggleRule(rid) {
  const el = document.getElementById("rule-" + rid);
  if (!el) return;
  const opening = !el.classList.contains("open");
  document.querySelectorAll(".rule-row").forEach(r => r.classList.remove("open"));
  if (opening) el.classList.add("open");
}

function buildLegend() {
  document.getElementById("legend").innerHTML = `
    <span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#64748b;margin-right:12px">
      <span style="width:10px;height:10px;border-radius:2px;background:${COLOR.trigger};display:inline-block"></span>Rule triggered</span>
    <span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#64748b;margin-right:12px">
      <span style="width:10px;height:10px;border-radius:2px;background:${COLOR.idle};display:inline-block"></span>No trigger</span>
    <span style="font-size:11px;color:#94a3b8">· Click green → tickers · click ticker → why-buy K-line</span>`;
}

function buildCalendar() {
  const days = DATA.days;
  const keys = Object.keys(days).sort();
  const start = new Date(keys[0] + "T12:00:00");
  const end = new Date(keys[keys.length - 1] + "T12:00:00");
  const months = [];
  let y = start.getFullYear(), m = start.getMonth() + 1;
  const ey = end.getFullYear(), em = end.getMonth() + 1;
  while (y < ey || (y === ey && m <= em)) {
    months.push([y, m]);
    m++; if (m > 12) { m = 1; y++; }
  }

  let html = '<div style="display:flex;margin-left:36px;gap:2px;margin-bottom:4px">';
  for (let d = 1; d <= 31; d++) {
    html += `<div style="width:14px;text-align:center;font-size:8px;color:#94a3b8;flex-shrink:0">${d}</div>`;
  }
  html += "</div>";

  for (const [yr, mo] of months) {
    const dim = new Date(yr, mo, 0).getDate();
    let cells = "";
    for (let day = 1; day <= 31; day++) {
      if (day > dim) {
        cells += '<div style="width:14px;height:14px;flex-shrink:0"></div>';
        continue;
      }
      const ds = `${yr}-${String(mo).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const dd = days[ds];
      if (!dd) {
        cells += `<div style="width:14px;height:14px;border-radius:2px;background:${COLOR.idle};flex-shrink:0"></div>`;
        continue;
      }
      const bg = COLOR[dd.status] || COLOR.idle;
      const tip = `${dd.full_date} — ${dd.n_triggers ? dd.n_triggers + " trigger(s)" : "no trigger"}`;
      if (dd.status === "trigger") {
        cells += `<div id="sq-${ds}" class="sq" style="width:14px;height:14px;border-radius:2px;background:${bg};cursor:pointer;flex-shrink:0" onclick="showDay('${ds}')" title="${tip}"></div>`;
      } else {
        cells += `<div style="width:14px;height:14px;border-radius:2px;background:${bg};flex-shrink:0" title="${tip}"></div>`;
      }
    }
    html += `<div style="display:flex;align-items:center;margin-bottom:3px">
      <div style="width:34px;font-size:10px;font-weight:600;color:#64748b;flex-shrink:0;text-align:right;padding-right:4px">${monthAbbr(mo)}</div>
      <div style="display:flex;gap:2px">${cells}</div></div>`;
  }
  document.getElementById("calendar").innerHTML = html;
}

function showDay(ds) {
  const d = DATA.days[ds];
  if (!d || d.status !== "trigger") return;
  document.querySelectorAll(".sq").forEach(el => el.style.outline = "");
  const sq = document.getElementById("sq-" + ds);
  if (sq) sq.style.outline = "2px solid #2563eb";
  document.getElementById("chart-panel").style.display = "none";
  activeTrig = null;

  let rows = "";
  for (const id of d.trigger_ids) {
    const t = DATA.triggers[id];
    if (!t) continue;
    const rp = t.realized_pnl ?? (t.status === "realized" ? t.pnl : 0);
    const up = t.unrealized_pnl ?? (t.status === "unrealized" ? t.pnl : 0);
    const rr = t.realized_roi ?? stakeRoi(rp, t.stake);
    const ur = t.unrealized_roi ?? stakeRoi(up, t.stake);
    const tr = t.roi ?? stakeRoi(t.pnl, t.stake);
    rows += `
      <div class="trig" id="trig-${id}" onclick="showTicker('${id}')">
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
          <span style="font-weight:800;font-size:16px">${t.ticker}</span>
          <span class="pill">${t.status === "realized" ? "closed" : "open · managing"}</span>
          <span class="muted">rule <b>${t.rule_title || t.rule}</b> · ${t.kind}</span>
          <span class="muted" style="margin-left:auto"></span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:13px">
          <div>Realized <b class="${cls(rr)}">${fmtPct(rr)}</b></div>
          <div>Unrealized <b class="${cls(ur)}">${fmtPct(ur)}</b></div>
          <div>Total <b class="${cls(tr)}">${fmtPct(tr)}</b></div>
        </div>
        <div class="muted" style="margin-top:4px">$1k paper · entry $${t.entry} on ${t.entry_date}${t.reason ? " · " + t.reason : ""}</div>
      </div>`;
  }

  const el = document.getElementById("day-detail");
  el.style.display = "block";
  el.innerHTML = `
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px">
      <div style="font-size:18px;font-weight:700">${d.full_date}</div>
      <div class="muted">${d.weekday}</div>
      <span style="font-size:11px;padding:2px 10px;border-radius:12px;color:#fff;background:#16a34a">${d.n_triggers} trigger(s)</span>
    </div>
    <p class="muted" style="margin:0 0 12px">Click a ticker → K-line of the buy + the setup before it</p>
    ${rows}`;
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function showTicker(id) {
  const t = DATA.triggers[id];
  const ch = DATA.charts[id];
  if (!t) return;
  activeTrig = id;
  document.querySelectorAll(".trig").forEach(el => el.classList.remove("active"));
  const card = document.getElementById("trig-" + id);
  if (card) card.classList.add("active");

  const rp = t.realized_pnl ?? (t.status === "realized" ? t.pnl : 0);
  const up = t.unrealized_pnl ?? (t.status === "unrealized" ? t.pnl : 0);
  const rr = t.realized_roi ?? stakeRoi(rp, t.stake);
  const ur = t.unrealized_roi ?? stakeRoi(up, t.stake);
  document.getElementById("chart-caption").innerHTML =
    `<b>${t.ticker}</b> · why-buy + ${t.status === "realized" ? "15d after exit" : "active mark"}`
    + ` · Realized <span class="${cls(rr)}">${fmtPct(rr)}</span>`
    + ` · Unrealized <span class="${cls(ur)}">${fmtPct(ur)}</span>`
    + (t.status === "unrealized" ? ` · mark $${t.mark}` : ` · exited ${t.exit_date || ""}`);

  const panel = document.getElementById("chart-panel");
  panel.style.display = "block";
  drawChart(t, ch);
  panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function visibleMAs() {
  return [...document.querySelectorAll('.toggles input[data-ma]:checked')].map(x => x.dataset.ma);
}

function whyBuyRange(r, ch) {
  const lookback = (DATA.chart_defaults && DATA.chart_defaults.lookback) || 90;
  const postOpen = (DATA.chart_defaults && DATA.chart_defaults.post_entry_open) || 5;
  const postExit = (DATA.chart_defaults && DATA.chart_defaults.post_exit) || 15;
  const i = ch.dates.indexOf(r.entry_date);
  if (i < 0) return undefined;
  const i0 = Math.max(0, i - lookback);
  let i1;
  if (r.exit_date && ch.dates.indexOf(r.exit_date) >= 0) {
    // Still show sell, but keep the frame anchored on the setup → buy → exit
    i1 = Math.min(ch.dates.length - 1, ch.dates.indexOf(r.exit_date) + postExit);
  } else {
    // Open ticket: buy + a few sessions after (active management continues daily)
    i1 = Math.min(ch.dates.length - 1, i + postOpen);
  }
  // If exit is far after entry, prefer setup+buy focus: cap post-entry stretch
  // but never hide the sell marker day
  if (r.exit_date && ch.dates.indexOf(r.exit_date) >= 0) {
    const iExit = ch.dates.indexOf(r.exit_date);
    i1 = Math.min(ch.dates.length - 1, Math.max(i + postOpen, iExit + postExit));
  }
  return [ch.dates[i0], ch.dates[i1]];
}

function drawChart(r, ch) {
  if (!ch) {
    document.getElementById("chart").innerHTML = '<div style="color:#94a3b8;padding:40px;text-align:center">No OHLC for this ticker</div>';
    return;
  }
  const traces = [{
    type: "candlestick",
    x: ch.dates, open: ch.open, high: ch.high, low: ch.low, close: ch.close,
    name: r.ticker,
    increasing: { line: { color: "#3dd68c" }, fillcolor: "#3dd68c" },
    decreasing: { line: { color: "#f07178" }, fillcolor: "#f07178" },
  }];
  for (const key of visibleMAs()) {
    const st = MA_STYLE[key];
    if (!ch[key]) continue;
    traces.push({
      type: "scatter", mode: "lines", x: ch.dates, y: ch[key],
      name: st.name, line: { color: st.color, width: st.width }, hoverinfo: "x+y+name",
    });
  }
  const why = ch.why || r.why || {};
  const shapes = [{
    type: "line", x0: r.entry_date, x1: r.entry_date, y0: 0, y1: 1, yref: "paper",
    line: { color: "#5b9fd4", width: 1.5, dash: "dot" },
  }];
  const annotations = [{
    x: r.entry_date, y: r.entry, ax: 0, ay: -36,
    text: `BUY $${Number(r.entry).toFixed(2)}`, showarrow: true, arrowhead: 2,
    bgcolor: "#5b9fd4", font: { color: "#0f1419", size: 11 }, borderpad: 3,
  }];
  if (why.pivot != null) {
    const range = whyBuyRange(r, ch) || [ch.dates[0], ch.dates[ch.dates.length - 1]];
    shapes.push({
      type: "line", x0: range[0], x1: range[1],
      y0: why.pivot, y1: why.pivot,
      line: { color: "#5b9fd4", width: 1, dash: "dash" }, opacity: 0.7,
    });
    annotations.push({
      x: r.entry_date, y: why.pivot, ax: 50, ay: 18, showarrow: false,
      text: `pivot $${why.pivot}`, font: { color: "#5b9fd4", size: 10 },
    });
  }
  if (why.stop != null) {
    const i = ch.dates.indexOf(r.entry_date);
    shapes.push({
      type: "line",
      x0: ch.dates[Math.max(0, i - 5)],
      x1: r.exit_date || ch.dates[Math.min(ch.dates.length - 1, i + 5)],
      y0: why.stop, y1: why.stop,
      line: { color: "#f07178", width: 1, dash: "dash" }, opacity: 0.8,
    });
  }

  const sellX = [], sellY = [], sellText = [];
  (r.fills || []).forEach(f => {
    const d = f.date || ch.dates[ch.dates.length - 1];
    sellX.push(d); sellY.push(f.price);
    sellText.push(`SELL @$${Number(f.price).toFixed(2)}<br>${f.reason || ""}`);
    shapes.push({
      type: "line", x0: d, x1: d, y0: 0, y1: 1, yref: "paper",
      line: { color: "#f5a623", width: 1, dash: "dot" },
    });
  });
  // live mark for open tickets
  if (r.status === "unrealized" && r.mark != null) {
    const last = ch.dates[ch.dates.length - 1];
    traces.push({
      type: "scatter", mode: "markers", x: [last], y: [r.mark],
      marker: { symbol: "circle", size: 10, color: "#38bdf8", line: { width: 1, color: "#fff" } },
      name: "Mark", text: [`MARK $${Number(r.mark).toFixed(2)}`], hoverinfo: "text",
    });
  }
  traces.push({
    type: "scatter", mode: "markers", x: [r.entry_date], y: [r.entry],
    marker: { symbol: "triangle-up", size: 14, color: "#5b9fd4", line: { width: 1, color: "#fff" } },
    name: "Buy", text: [`BUY $${Number(r.entry).toFixed(2)}`], hoverinfo: "text",
  });
  if (sellX.length) {
    traces.push({
      type: "scatter", mode: "markers", x: sellX, y: sellY,
      marker: { symbol: "triangle-down", size: 14, color: "#f5a623", line: { width: 1, color: "#fff" } },
      name: "Sell", text: sellText, hoverinfo: "text",
    });
  }

  const range = whyBuyRange(r, ch);

  Plotly.newPlot("chart", traces, {
    paper_bgcolor: "#1a2332", plot_bgcolor: "#1a2332",
    margin: { l: 50, r: 20, t: 30, b: 40 },
    xaxis: { rangeslider: { visible: false }, gridcolor: "#2a3548", color: "#8b9bb4", range },
    yaxis: { gridcolor: "#2a3548", color: "#8b9bb4", side: "right" },
    legend: { orientation: "h", y: 1.1, font: { color: "#8b9bb4", size: 11 } },
    shapes, annotations,
    font: { color: "#e7ecf3", family: "IBM Plex Sans, sans-serif" },
  }, { responsive: true, displayModeBar: true, displaylogo: false });
}

document.querySelector(".toggles").addEventListener("change", () => {
  if (!activeTrig) return;
  drawChart(DATA.triggers[activeTrig], DATA.charts[activeTrig]);
});

fetch("portal_data.json")
  .then(r => r.json())
  .then(data => {
    DATA = data;
    const w = data.window || {};
    document.getElementById("sub").textContent =
      `Rolling 12m · $${data.performance.stake_per_trigger}/trigger · ${w.start || "?"} → ${w.end || data.asof} · updated ${data.generated}`;
    buildPerf();
    buildLegend();
    buildCalendar();
  })
  .catch(err => {
    document.getElementById("sub").textContent = "Failed to load portal_data.json: " + err;
  });
</script>
</body>
</html>
